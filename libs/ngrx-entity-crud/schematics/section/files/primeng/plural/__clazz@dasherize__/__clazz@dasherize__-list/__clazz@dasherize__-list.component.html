<ng-container *ngLet="(dirtyIds$ | async) as dirtyIds">
  <p-table [value]="rows$ | async"
           dataKey="id"
           editMode="cell"
           [selection]="itemsSelected$ | async"
           (selectionChange)="onSelectionChange($event)"
           (onEditInit)="onEditInit($event)"
           (onEditComplete)="onEditComplete($event)">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th *ngFor="let col of cols">
          {{col}}
        </th>
        <th style="width: 13em">actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <!-- la riga in bozza (entitiesSelected diverso da entities) viene evidenziata -->
      <tr [class.draft-row]="isDirty(item, dirtyIds)">
        <td>
          <p-tableCheckbox [value]="item"></p-tableCheckbox>
        </td>
        <td *ngFor="let col of cols" [pEditableColumn]="item" [pEditableColumnField]="col">
          <p-cellEditor *ngIf="isEditable(item, col); else readOnly">
            <ng-template pTemplate="input">
              <input pInputText class="w-full" [type]="inputType(item[col])" [(ngModel)]="item[col]">
            </ng-template>
            <ng-template pTemplate="output">
              {{item[col]}}
            </ng-template>
          </p-cellEditor>
          <ng-template #readOnly>{{item[col]}}</ng-template>
        </td>
        <td>

          <button pButton pRipple type="button" icon="pi pi-undo" title="Annulla bozza"
                  *ngIf="isDirty(item, dirtyIds)"
                  class="p-button-rounded p-button-warning p-button-outlined mr-1" (click)="onUndoDraft(item)"></button>
          <button pButton pRipple type="button" icon="pi pi-copy" class="p-button-rounded p-button-outlined mr-1" (click)="onCopy(item)"></button>
          <button pButton pRipple type="button" icon="pi pi-pencil" class="p-button-rounded p-button-success p-button-outlined mr-1" (click)="onEdit(item)"></button>
          <button pButton pRipple type="button" icon="pi pi-times" class="p-button-rounded p-button-danger p-button-outlined" (click)="onDelete(item)"></button>

        </td>
      </tr>
    </ng-template>
  </p-table>
</ng-container>
