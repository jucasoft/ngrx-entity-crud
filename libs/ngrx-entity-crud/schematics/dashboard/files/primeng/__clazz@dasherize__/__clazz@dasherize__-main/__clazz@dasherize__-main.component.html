<p-card header="<%= clazz %>">
  <!--
    <nec-dashboard> introspeziona localStorage, IndexedDB (in modo agnostico) e gli store NgRx.
    Input opzionali:
      - [blacklist] / [whitelist]: filtra le slice dello store.
      - lazyReportUrl: percorso del lazy-report JSON (segue --lazy-report-output dello
        schematic; stringa vuota per disattivare la correlazione statica).
      - tableReportUrl: percorso del table-report JSON del pannello Tables (segue
        --table-report-output dello schematic; stringa vuota per nascondere il pannello).
      - [idbDatabaseNames]: nomi DB da ispezionare dove indexedDB.databases() non è supportato
        (es. Firefox/Safari), p.es. [idbDatabaseNames]="['NgRxStateStore']".
      - [pollingMs]: auto-refresh in ms (0 = solo manuale).
      - [pythonSnippetKeys]: chiavi localStorage esportate come variabili nel pannello dedicato
        "Python snippet" (es. ['access_token']); le anteprime a schermo sono mascherate, ma
        ATTENZIONE: la copia mette i valori IN CHIARO negli appunti.
        [apiBaseUrl]: base URL delle API nello snippet (default location.origin).
    Il pannello "NgRx store" espone i pulsanti "reset" / "reset responses" per riga e
    "Reset all" (con conferma a due step); l'output (sliceReset)="..." emette la key
    della slice azzerata. Il pannello "Tables" mostra l'inventario delle griglie
    (ag-Grid / p-table) generato da ngrx-entity-crud:table-report, correlato a runtime
    con le slice montate.
  -->
  <nec-dashboard lazyReportUrl="<%= lazyReportUrl %>"
                 tableReportUrl="<%= tableReportUrl %>"></nec-dashboard>
<% if (includeScaffold) { %>
  <!--
    <nec-scaffold> costruisce il file di configurazione (dtoObject/keys/conditionMap) e i
    comandi `ng generate` per scaffoldare una nuova sezione "form di ricerca + griglia".
    Gli input qui sotto sono i default: adattali al flusso del progetto (stringa vuota
    nasconde il comando corrispondente; apiSchematic è opt-in, es. "grm-schematics:api").
    Altri input: [checklist]="['...']" per i passi manuali post-generazione.
  -->
  <nec-scaffold confDir="grm-schematics/conf"
                storeSchematic="ngrx-entity-crud:store"
                viewSchematic="grm-schematics:view"></nec-scaffold>
<% } %></p-card>
