# This workflow will publish a package to npm when a release is created
name: Publish to npm

on:
  release:
    types: [created]

jobs:
  # Chiama il workflow riutilizzabile per assicurarsi che il codice sia valido
  build_and_test:
    uses: ./.github/workflows/reusable-build.yml

  # Una volta che la build ha successo, procedi alla pubblicazione
  publish-npm:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Esegui la build di nuovo o scarica l'artefatto.
      # Per semplicità, qui rieseguiamo la build.
      # In scenari complessi, potresti passare artefatti dal workflow riutilizzabile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Publish to npm
        # Il tuo project.json mostra che il comando 'publish' già naviga in dist/
        run: npm run publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
